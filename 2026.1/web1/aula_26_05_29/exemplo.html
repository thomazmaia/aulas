<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(219, 219, 219);
            font-family: Arial, Helvetica, sans-serif;            
        }
        .header {
            width: 350px;
            height: 40px;            
            position: absolute;
            left: 0px;
            top: 0px;
            background-color: rgb(28, 190, 28);
            color: white;
            text-align: center;
            font-size: 30px;
            padding: 40px;
        }

        .bemvindo {
            position: relative;
            top: 150px;
            text-align: center;
        }

        .conheca {
            position: relative;
            top: 170px;            
            background-color: coral;
            color: white;
            text-align: center;
            padding: 10px;
            margin: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">Informática IFCE</div>
    <div class="bemvindo">Bem vindos à pagina bla bla bla</div>
    <div class="conheca">Conheça a turma</div>
</body>
</html>
