<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>FLEXBOX</h1>

    <section id="direction">
        <h2>flex-direction</h2>
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 3</div>
    </section>

    <section id="justify">
        <h2>justify-content</h2>
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 3</div>
    </section>    

    <section id="align-items">
        <h2>align-items</h2>
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 3</div>
    </section>

    <section id="wrap">
        <h2>flex-wrap</h2>
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 3</div>
        <div class="box">box 4</div>
        <div class="box">box 5</div>
        <div class="box">box 6</div>
        <div class="box">box 7</div>
    </section>      

    <section id="gap">
        <h2>flex-wrap + gap</h2>
        <div class="box">box 1</div>
        <div class="box">box 2</div>
        <div class="box">box 3</div>
        <div class="box">box 4</div>
        <div class="box">box 5</div>
        <div class="box">box 6</div>
        <div class="box">box 7</div>
    </section> 

    <section id="flex-grow">
        <h2>flex-grow</h2>
        <div class="box grow1">box 1</div>
        <div class="box grow2">box 2</div>
        <div class="box grow1">box 3</div>
    </section>

    <section id="flex-basis">
        <h2>flex-basis</h2>
        <div class="box basis100">box 1</div>
        <div class="box basis200">box 2</div>
        <div class="box basis100">box 3</div>
    </section>        
</body>
</html>
