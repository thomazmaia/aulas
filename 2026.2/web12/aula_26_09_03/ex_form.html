<!DOCTYPE html>
<head>
    <title>Document</title>
</head>
<body>
    <form action="/enviar_dados" method="get">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="Nome" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="Senha">

        <label for="email">Email:</label>
        <input type="email" id="email" name="Email">

        <label for="radio">Escolha uma opcão:</label><br>
        <input type="radio" name="op">Opcão 1<br>
        <input type="radio" name="op">Opcão 2<br>
        <input type="radio" name="op">Opcão 3<br>

        <label for="checkbox">Escolha várias opções:</label><br>
        <input type="checkbox">Opção 1<br>
        <input type="checkbox">Opção 2<br>
        <input type="checkbox">Opção 3<br>

        <input type="submit"><br>

        <input type="button" value="Botão aqui">

        <input type="file">
    </form>
</body>
</html>
